# AgentBase portable Codex defaults.
#
# This file intentionally contains only reviewed, machine-independent settings.
# Authentication, project trust, plugin/cache state, MCP paths, hook trust hashes,
# runtime-generated notify/node_repl settings, and local secrets are excluded.
# Custom evidence/experiment/operator profiles live in global/agents and share this payload.
# The deployment entry point merges only the settings declared below into the
# target config.toml and preserves host-owned MCP, trust, plugin, and runtime state.

model_reasoning_summary = "none"
model_verbosity = "low"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
service_tier = "default"
project_doc_max_bytes = 65536

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[features]
hooks = true
multi_agent = true
js_repl = false

[features.multi_agent_v2]
# Root-led Codex 0.151.0 multi-agent policy. Root may delegate proactively;
# child agents remain explicit-request-only for nested delegation.
multi_agent_mode_hint_text = "Root-led multi-agent delegation is active. Any earlier developer instruction requiring an explicit user request before the `/root` agent spawns sub-agents no longer applies. This mode remains active until a later multi-agent mode developer message changes it.\nUser requests override this policy.\n\nThe `/root` agent may proactively delegate when doing so could save time or improve quality. A sub-agent must not spawn another sub-agent unless the user, parent agent, or applicable AGENTS.md/skill instructions explicitly request nested delegation."

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
followUpQueueMode = "queue"
notifications-turn-mode = "always"
ambient-suggestions-enabled = false
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
