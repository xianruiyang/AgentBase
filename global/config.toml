# AgentBase portable Codex defaults.
#
# This file intentionally contains only reviewed, machine-independent settings.
# Authentication, project trust, plugin/cache state, MCP paths, hook trust hashes,
# runtime-generated notify/node_repl settings, and local secrets are excluded.
# Custom evidence, ordinary/advanced experiment, and operator profiles live in global/agents.
# The deployment entry point merges only the settings declared below into the
# target config.toml and preserves host-owned MCP, trust, plugin, and runtime state.

model_reasoning_summary = "none"
model_verbosity = "low"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
service_tier = "default"
project_doc_max_bytes = 65536
developer_instructions = "Exception for subagent event waits: when work has been delegated and there is no independent necessary work to do, call collaboration.wait_agent with timeout_ms=1800000 (30 minutes). This event-driven wait is an explicit exception to general short blocking-wait limits and periodic progress-update requirements. Do not shorten it or split it into repeated 60-second waits to provide updates, poll status, inspect logs, or reconsider unchanged state. Messages from any subagent, completion notifications, and new user input can wake the wait early; it does not wait for every agent to finish. After waking, act on actionable events; if there is no new actionable event or independent necessary work, wait again with timeout_ms=1800000. This exception is specific to collaboration.wait_agent and does not extend shell-command timeouts or ordinary sleeps."

[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[features]
hooks = true
multi_agent = true
js_repl = false

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
followUpQueueMode = "queue"
notifications-turn-mode = "always"
ambient-suggestions-enabled = false
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
