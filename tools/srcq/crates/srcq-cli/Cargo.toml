[package]
name = "srcq-cli"
description = "Windows token-safe source query adapter for ast-grep, ripgrep, and fd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-helper = []

[[bin]]
name = "srcq"
path = "src/main.rs"

[[bin]]
name = "srcq-native-fixture"
path = "tests/helpers/native_fixture.rs"
required-features = ["test-helper"]

[dependencies]
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
srcq-core = { path = "../srcq-core" }
thiserror.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[dev-dependencies]
saphyr-parser.workspace = true
tempfile.workspace = true
