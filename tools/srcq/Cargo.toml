[workspace]
members = ["crates/srcq-cli", "crates/srcq-core", "tools/srcq-release", "tests/integration", "tests/protocol", "tests/stress", "tests/unit"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
atomic-write-file = "=0.3.0"
clap = { version = "=4.6.1", default-features = false, features = ["error-context", "help", "std", "suggestions", "usage"] }
command-group = "=5.0.1"
file-id = "=0.2.3"
fs2 = "=0.4.3"
humantime = "=2.3.0"
saphyr-parser = "=0.0.11"
serde_json = { version = "=1.0.150", features = ["arbitrary_precision", "preserve_order"] }
proptest = "=1.8.0"
portable-pty = "=0.9.0"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
thiserror = "=2.0.18"
ctrlc = { version = "=3.5.2", features = ["termination"] }
ulid = "=1.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
