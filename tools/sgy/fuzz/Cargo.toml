[package]
name = "sgy-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
serde_json = { version = "=1.0.150", features = ["arbitrary_precision", "preserve_order"] }
sgy-cli = { path = "../crates/sgy-cli" }
sgy-core = { path = "../crates/sgy-core" }
tempfile = "=3.23.0"

[[bin]]
name = "argv_defaults"
path = "fuzz_targets/argv_defaults.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_yaml"
path = "fuzz_targets/json_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safe_yaml"
path = "fuzz_targets/safe_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_schema_paths"
path = "fuzz_targets/config_schema_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "budget_cache"
path = "fuzz_targets/budget_cache.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
