name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-contract:
    name: Project contract and skill tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Validate routing and portable deployment contracts
        run: |
          & .\development\skill-routing\validate_contract.ps1 -ProjectRoot $PWD.Path
          & .\development\skill-routing\test_routing_fingerprint.ps1
          & .\development\skill-routing\test_routing_capsule.ps1
          & .\development\skill-routing\validate_routing_results.ps1 -ProjectRoot $PWD.Path -ResultsPath .\development\skill-routing\evidence\current.json
          & .\development\codex-deployment\manage_agentbase.ps1 -Action Validate -ProjectRoot $PWD.Path
          & .\development\codex-deployment\test_portable_config.ps1 -ProjectRoot $PWD.Path
          & .\development\codex-deployment\test_manage_agentbase.ps1 -ProjectRoot $PWD.Path

      - name: Build filtered plugin package
        run: |
          $defaultOutputRejected = $false
          try {
            & .\development\plugin-packaging\build_plugin.ps1 -ProjectRoot $PWD.Path -SkipOfficialValidation | Out-Null
          } catch {
            $defaultOutputRejected = $_.Exception.Message -like 'SkipOfficialValidation requires an explicit isolated OutputRoot*'
          }
          if (-not $defaultOutputRejected) { throw 'Plugin builder allowed an unvalidated package in the marketplace output' }
          $pluginOutput = Join-Path $env:RUNNER_TEMP 'agentbase-plugin-package'
          $pluginRoot = & .\development\plugin-packaging\build_plugin.ps1 -ProjectRoot $PWD.Path -OutputRoot $pluginOutput -SkipOfficialValidation
          $manifest = Get-Content -LiteralPath (Join-Path $pluginRoot 'build-manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $expectedSkillCount = @((Get-Content -LiteralPath .\development\skill-routing\trigger-cases.json -Raw -Encoding UTF8 | ConvertFrom-Json).required_skills).Count
          if ([int]$manifest.schema_version -ne 2 -or [int]$manifest.skill_count -ne $expectedSkillCount -or [bool]$manifest.official_plugin_validation) { throw 'Plugin CI build manifest is invalid' }
          $pluginRootPath = [IO.Path]::GetFullPath([string]$pluginRoot).TrimEnd('\')
          $runtimeArtifacts = @(Get-ChildItem -LiteralPath $pluginRootPath -Recurse -Force | Where-Object { $relative = $_.FullName.Substring($pluginRootPath.Length + 1); $relative -match '(?i)(^|[\\/])(__pycache__|node_modules|target|dist)([\\/]|$)' -or $_.Extension -in @('.pyc', '.pyo', '.log', '.tmp') })
          if ($runtimeArtifacts.Count -ne 0) { throw "Plugin package contains a runtime artifact: $($runtimeArtifacts[0].FullName)" }
          $sourceQueryRoot = Join-Path $pluginRootPath 'skills\source-query'
          if (-not (Test-Path -LiteralPath (Join-Path $sourceQueryRoot 'SKILL.md') -PathType Leaf)) { throw 'Plugin package omitted source-query' }
          $privateQueryRuntime = @(Get-ChildItem -LiteralPath $sourceQueryRoot -Recurse -File | Where-Object Extension -eq '.exe')
          if ($privateQueryRuntime.Count -ne 0) { throw 'Plugin package contains a private source-query runtime' }

      - name: Run skill regression tests
        run: |
          python -X utf8 .\skills\codex-event-logger\tests\test_event_logger.py
          python -X utf8 .\skills\delivery-workflow\tests\test_workctl.py
          python -X utf8 .\skills\task-table-manager\tests\test_taskctl.py
          node --test .\skills\reasoning-governor\tests\test_reasoning_governor.mjs
          & .\skills\codex-qq-hook\tests\test_qq_hook_switch.ps1
          & .\skills\codex-qq-hook\tests\test_send_qq_message.ps1
          & .\skills\codex-qq-hook\tests\test_install_global_qq_hook.ps1

      - name: Test QQ event capture server
        working-directory: development/codex-qq-hook
        run: go test .\qq_event_capture.go .\qq_event_capture_test.go

  vscode-lsp-mcp:
    name: VS Code LSP MCP release gate
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
        working-directory: mcp/vscode-lsp-mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp/vscode-lsp-mcp/package-lock.json
      - run: npm ci
      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev
      - name: Run complete Windows release verification
        run: npm run verify:release

  srcq-windows:
    name: srcq Windows native release gate
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install fixed Rust toolchain and ast-grep
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
          npm install --global @ast-grep/cli@0.44.1

      - name: Run native workspace tests
        working-directory: tools/srcq
        run: cargo test --workspace --locked

      - name: Build, verify and install native Windows releases
        working-directory: tools/srcq
        run: |
          $outputV1 = Join-Path $env:RUNNER_TEMP 'srcq-release-v1'
          $outputV2 = Join-Path $env:RUNNER_TEMP 'srcq-release-v2'
          & .\scripts\build-release.ps1 -Clean -Version 0.2.0 -SourceRevision $env:GITHUB_SHA -SourceDateEpoch 0 -OutDir $outputV1
          & .\scripts\build-release.ps1 -Clean -Version 0.2.1 -SourceRevision $env:GITHUB_SHA -SourceDateEpoch 0 -OutDir $outputV2
          $archiveV1 = Get-ChildItem -LiteralPath $outputV1 -Filter '*.zip' -File | Select-Object -First 1
          $archiveV2 = Get-ChildItem -LiteralPath $outputV2 -Filter '*.zip' -File | Select-Object -First 1
          if (-not $archiveV1 -or -not $archiveV2) { throw 'srcq release archives are missing' }
          foreach ($archive in @($archiveV1, $archiveV2)) {
            $checksum = Get-Content -LiteralPath ($archive.FullName + '.sha256') -Raw -Encoding UTF8
            $archiveHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not $checksum.StartsWith($archiveHash, [StringComparison]::Ordinal)) { throw "srcq checksum does not match $($archive.Name)" }
          }
          $engine = Join-Path ((npm root --global).Trim()) '@ast-grep\cli\ast-grep.exe'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw "Native ast-grep executable is missing: $engine" }
          & .\scripts\test-install-srcq.ps1 -ArchiveV1 $archiveV1.FullName -ArchiveV2 $archiveV2.FullName -Engine $engine -ExpectedVersionV1 0.2.0 -ExpectedVersionV2 0.2.1
          $runtime = '.\target\release-build\x86_64-pc-windows-msvc\x86_64-pc-windows-msvc\release\srcq.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'srcq-runtime-fixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          [IO.File]::WriteAllText((Join-Path $fixture 'sample.ts'), 'console.log(value);', [Text.UTF8Encoding]::new($false))
          & $runtime doctor --engine $engine --cwd $fixture
          if ($LASTEXITCODE -ne 0) { throw 'srcq doctor failed' }
          & $runtime exec --engine $engine --cwd $fixture -- run -p 'console.log($A)' -l ts .
          if ($LASTEXITCODE -ne 0) { throw 'srcq real-engine smoke failed' }

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: tools/srcq
